name: Refresh plugin zip from the closing-the-loop repo

# Keeps downloads/closing-the-loop-plugin.zip in sync with the plugin repo's
# main branch — so the guide's Download button always serves the latest
# released version, with no manual rebuilding.
#
# Needs one repository secret: CTL_REPO_SSH_KEY — the private half of a
# read-only deploy key on Visma-AI-Engineering-Technology/closing-the-loop
# (that repo is `internal`, so the default GITHUB_TOKEN can't reach it from
# this org; the deploy key is scoped to that one repo and read-only).

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}     # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the guide site
        uses: actions/checkout@v4

      - name: Check out the plugin repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: Visma-AI-Engineering-Technology/closing-the-loop
          ref: main
          ssh-key: ${{ secrets.CTL_REPO_SSH_KEY }}
          path: plugin-src

      # Claude's plugin upload is stricter than Claude Code (no zip inside the zip, description
      # limits, ...). The plugin repo checks this on every PR; checking again here means a zip
      # the upload would refuse is never published, whatever reached main. A failure stops the
      # run before anything is rebuilt, so the last good zip stays up.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin main against Claude's upload rules
        working-directory: plugin-src
        run: |
          pip install --quiet pyyaml
          python scripts/validate-plugin-upload.py HEAD

      - name: Rebuild zip, checksums, and version.json when main moved
        run: |
          set -euo pipefail
          NEW_SHA=$(git -C plugin-src rev-parse HEAD)
          OLD_SHA=$(jq -r '.commit // ""' downloads/version.json 2>/dev/null || echo "")
          if [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "Plugin main unchanged ($NEW_SHA) — nothing to do."
            exit 0
          fi
          VERSION=$(jq -r '.version // "unknown"' plugin-src/.claude-plugin/plugin.json)
          git -C plugin-src archive --format=zip --prefix=closing-the-loop/ HEAD \
            -o "$GITHUB_WORKSPACE/downloads/closing-the-loop-plugin.zip"
          cd downloads
          sha256sum closing-the-loop-plugin.zip > SHA256SUMS.txt
          jq -n --arg v "$VERSION" --arg d "$(date -u +%F)" --arg c "$NEW_SHA" \
            '{version:$v, released:$d, commit:$c}' > version.json
          cd ..
          git config user.name "ctl-guide-bot"
          git config user.email "actions@github.com"
          git add downloads/
          git commit -m "chore: refresh plugin zip to $VERSION (${NEW_SHA:0:7})"
          git push
